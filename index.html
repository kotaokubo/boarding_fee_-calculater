  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="金沢八景 一之瀬丸の釣り船料金を簡単に計算できるツールです。乗合船・仕立て船の料金、レンタル品を含めた総額を自動計算します。" />
  <title>釣り船 料金計算ツール</title>
  
  <!-- OGP Meta Tags -->
  <meta property="og:title" content="釣り船 料金計算ツール | 一之瀬丸" />
  <meta property="og:description" content="金沢八景 一之瀬丸の釣り船料金を簡単に計算できるツールです。乗合船・仕立て船の料金、レンタル品を含めた総額を自動計算します。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.ichinosemaru.com/" />

  <meta property="og:site_name" content="一之瀬丸" />
  <meta property="og:locale" content="ja_JP" />
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="釣り船 料金計算ツール | 一之瀬丸" />
  <meta name="twitter:description" content="金沢八景 一之瀬丸の釣り船料金を簡単に計算できるツールです。乗合船・仕立て船の料金、レンタル品を含めた総額を自動計算します。" />
  <meta name="twitter:image" content="https://www.ichinosemaru.com/ichinosemaru_logo_x3.png" />
  
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-root">
  <div class="app-container">
    <header class="top">
      <a href="https://www.ichinosemaru.com" target="_blank">
        <img src="ichinosemaru_logo_x3.png" alt="一ノ瀬丸ロゴ" class="logo" />
      </a>
      <h1 class="site-title">釣り船 料金計算ツール</h1>
    </header>

    <main class="grid">
      <section class="card form-card">
        <h2 class="section-title">予約情報</h2>

        <div class="field">
          <label for="tripType">釣り船の種類</label>
          <select id="tripType" class="form-input select-dropdown">
            <option value="乗合船">乗合船</option>
            <option value="仕立て船">仕立て船（貸切船）</option>
          </select>
        </div>

        <div class="field">
          <label for="planSelect">プラン</label>
          <div class="plan-row">
            <select id="planSelect" class="form-input wide select-dropdown"></select>
            <div id="planTimes" class="meta-time"></div>
          </div>
          <div id="planSupplement" class="meta muted" style="margin-top:6px"></div>
        </div>

        <div class="field">
          <label for="date">日付</label>
          <div class="date-row">
            <input type="date" id="date" class="form-input wide" />
          </div>
        </div>

        <div class="field people-inputs">
          <label>人数</label>
          <div class="row" aria-label="人数">
            <div class="col people-col">
              <div class="label-row">
                <div class="unit-price" id="priceMen">—</div>
              </div>
              <select id="menCount" class="count-select">
                <!-- options 0..100 -->
              </select>
            </div>
            <div class="col people-col">
              <div class="label-row">
                <div class="unit-price" id="priceWomen">—</div>
              </div>
              <select id="womenCount" class="count-select">
                <!-- options 0..100 -->
              </select>
            </div>
            <div class="col people-col">
              <div class="label-row">
                <div class="unit-price" id="priceStudent">—</div>
              </div>
              <select id="studentCount" class="count-select">
                <!-- options 0..100 -->
              </select>
            </div>
          </div>
        </div>

        <div class="field">
          <label>レンタル品</label>
          <div id="rentalList" class="rentals"></div>
          <div class="note muted" style="font-size: 12px; margin-top: 6px;">※ ライフジャケットは無料でレンタルできます</div>
        </div>

        <div class="field">
          <label>購入品</label>
          <div id="shikakeList" class="shikake-items"></div>
          <div id="shikakeNote" class="note muted" style="font-size: 12px">※ 枚数・個数により値段が前後します。目安としてお考えください。</div>
        </div>
        <div class="actions">
          <button id="mailtoBtn" class="btn btn-primary">予約へ進む</button>
          <button id="resetBtn" class="btn btn-secondary">リセット</button>
        </div>
        <div class="note muted" style="font-size: 12px; color: #666; margin-top: 12px;">※ 時期や海況により、対応可能な釣り物が変わる場合がございます。あらかじめご了承ください。</div>
      </section>

      <aside class="card reservation-summary">
        <h2 class="section-title">予約内容</h2>
        <div id="breakdown" class="breakdown">— 選択内容を入力してください —</div>
      </aside>
    </main>

    <div id="footer" class="clearfix">
      <p id="f_left">神奈川県　第1038号</p>
      <div id="f_center">
        <p style="font-size:12px;">〒236-0028　横浜市金沢区洲崎町6-7</p>
        <p class="font24">有限会社　一之瀬丸</p>
      </div>
      <p id="f_right">
        Tel：<a href="tel:045-782-3714">045（782）3714</a>　<br />
        Fax：045（782）3590<br />
        E-mail：<a href="mailto:ichinosemaru1@docomo.ne.jp">ichinosemaru1@docomo.ne.jp</a>
      </p>
    </div>
  </div>
      <!-- Fixed total bar shown at bottom of viewport -->
      <div class="fixed-total" role="region" aria-label="合計金額">
        <div class="fixed-total-inner">
          <div class="fixed-label muted"></div>
          <div id="fixedTotalAmount" class="fixed-amount">—</div>
        </div>
      </div>

      <!-- Personal Info Modal -->
      <div id="personalInfoModal" class="modal" style="display:none;">
        <div class="modal-content">
          <div class="modal-header">
            <h2>お客様情報</h2>
            <button class="modal-close" id="modalCloseBtn">&times;</button>
          </div>
          <div class="modal-body">
            <form id="personalInfoForm">
              <div class="field">
                <label for="visitorName">お名前 <span class="required">*</span></label>
                <input type="text" id="visitorName" class="form-input wide" placeholder="例：山田太郎" required />
              </div>
              <div class="field">
                <label for="visitorKana">フリガナ <span class="required">*</span></label>
                <input type="text" id="visitorKana" class="form-input wide" placeholder="例：ヤマダタロウ" required />
              </div>
              <div class="field">
                <label for="visitorPhone">電話番号 <span class="required">*</span></label>
                <input type="tel" id="visitorPhone" class="form-input wide" placeholder="例：090-1234-5678" required />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button id="modalCancelBtn" class="btn btn-secondary">キャンセル</button>
            <button id="modalSubmitBtn" class="btn btn-primary">予約メールを作成</button>
          </div>
        </div>
      </div>

      <!-- Alert Modal -->
      <div id="alertModal" class="modal" style="display:none;">
        <div class="alert-modal-content">
          <div class="alert-modal-body">
            <p id="alertMessage">人数を1名以上選択してください</p>
          </div>
          <div class="alert-modal-footer">
            <button id="alertOkBtn" class="btn btn-primary">OK</button>
          </div>
        </div>
      </div>

      <script type="module" src="plans-data.js"></script>
      <script type="module" src="ga4-tracking.js"></script>
      <script type="module" src="main.js"></script>
</body>
</html>
